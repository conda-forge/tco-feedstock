{% set name = "tco" %}
{% set version = "1.2.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tco-{{ version }}.tar.gz
  sha256: 335e4f688efe38662a81e71416e408372fea6f5f226b13831b7d435e8fe611e1

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - tco
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/baruchel/tco
  summary: Tail Call Optimization for Python
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - ickc
